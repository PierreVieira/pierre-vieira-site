name: Feature request
description: An idea to make pierrevieira.com better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search the existing issues first, in case someone asked for it already.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do on the page, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How would you like the page to help? Sketches and examples from other sites are welcome.
    validations:
      required: true
