name: onedrive-cv

# Keeps the résumé in Pierre's OneDrive (Documentos/Curriculo/cv/cv_pierre_vieira.pdf) the same as the site's. It
# builds the PDF the way the deploy does (scripts/build-cv.sh) and uploads it with rclone, only when the
# PDF can have changed: a push to main that touches the .tex or its build. Pull requests never upload: what they
# change reaches OneDrive when they merge. A manual run uploads too.
#
# Microsoft's refresh token dies after 90 days unused, so every run saves the one rclone renewed, and a daily
# check renews it when the last renewal is 45 days old or more; on other days the check ends in seconds. GitHub turns
# off a public repository's scheduled workflows after 60 days without commits, so the check also re-enables this one,
# which keeps it on. The setup is in docs/onedrive.md.
on:
  push:
    branches:
      - main
    paths:
      - 'cv/**'
      - 'scripts/build-cv.sh'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# Why: two runs at once would both rotate the refresh token, and the one saved last could be the one already spent.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'PierreVieira/pierre-vieira-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Re-enabling this workflow, to keep its schedule on.
      actions: write
      contents: read
    steps:
      - name: Keep the schedule on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable onedrive-cv.yml

      # upload on a push or a manual run; on the daily check, renew when the token was last renewed 45 days ago or
      # more (or never), and else nothing.
      - name: Decide what to do
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REFRESHED_AT: ${{ vars.ONEDRIVE_TOKEN_REFRESHED_AT }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "mode=upload" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          days=999
          if [ -n "$REFRESHED_AT" ]; then
            days=$(( ( $(date -u +%s) - $(date -u -d "$REFRESHED_AT" +%s) ) / 86400 ))
          fi
          if [ "$days" -ge 45 ]; then
            echo "The token was last renewed $days days ago: renewing it."
            echo "mode=renew" >> "$GITHUB_OUTPUT"
          else
            echo "The token was last renewed $days days ago: nothing to do until day 45."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.plan.outputs.mode != 'skip'
        with:
          persist-credentials: false

      - name: Build the résumé
        if: steps.plan.outputs.mode == 'upload'
        run: bash scripts/build-cv.sh --force

      # A pinned release, checked against its SHA-256: Ubuntu's own rclone is too old for access_scopes.
      - name: Install rclone
        if: steps.plan.outputs.mode != 'skip'
        env:
          VERSION: v1.76.0
          SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        run: |
          curl -fsSL -o rclone.zip "https://downloads.rclone.org/$VERSION/rclone-$VERSION-linux-amd64.zip"
          echo "$SHA256  rclone.zip" | sha256sum -c -
          unzip -q rclone.zip
          sudo install "rclone-$VERSION-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf rclone.zip "rclone-$VERSION-linux-amd64"

      # Saves the renewed token in every case; uploads the PDF only on a push or a manual run.
      - name: Sync with OneDrive
        if: steps.plan.outputs.mode != 'skip'
        env:
          ONEDRIVE_DRIVE_ID: ${{ vars.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_RCLONE_TOKEN: ${{ secrets.ONEDRIVE_RCLONE_TOKEN }}
          GH_TOKEN: ${{ secrets.ONEDRIVE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPLOAD: ${{ steps.plan.outputs.mode == 'upload' && 'public/cv/cv_pierre_vieira.pdf' || '' }}
        run: node scripts/onedrive/sync.mjs ${UPLOAD:+--upload "$UPLOAD"}
