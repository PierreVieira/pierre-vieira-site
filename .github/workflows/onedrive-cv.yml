name: onedrive-cv

# Keeps the résumé in Pierre's OneDrive (Documentos/Curriculo/cv/cv_pierre_vieira.pdf) the same as the site's. It
# builds the PDF the way the deploy does (scripts/build-cv.sh) and uploads it with rclone, only when the PDF can have
# changed: a push to main that touches the .tex or its build. Pull requests never upload: what they change reaches
# OneDrive when they merge. A manual run uploads too, from main only.
#
# Microsoft's refresh token dies after 90 days unused, so every upload saves the one rclone renewed, and a daily check
# uploads again (which renews it) when the last renewal is 45 days old or more; on other days the check ends in
# seconds. GitHub turns off a public repository's scheduled workflows after 60 days without commits, so the check also
# re-enables this one, which keeps it on. The setup is in docs/onedrive.md.
on:
  push:
    branches:
      - main
    paths:
      - 'cv/**'
      - 'scripts/build-cv.sh'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether to upload: always on a push or a manual run; on the daily check, when the token was last renewed
  # 45 days ago or more, or never, or at a time that can't be read.
  plan:
    if: github.repository == 'PierreVieira/pierre-vieira-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      upload: ${{ steps.plan.outputs.upload }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REFRESHED_AT: ${{ vars.ONEDRIVE_TOKEN_REFRESHED_AT }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          days=999
          if [ -n "$REFRESHED_AT" ] && since=$(date -u -d "$REFRESHED_AT" +%s); then
            days=$(( ( $(date -u +%s) - since ) / 86400 ))
          fi
          if [ "$days" -ge 45 ]; then
            echo "The token was last renewed $days days ago: uploading again, which renews it."
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "The token was last renewed $days days ago: nothing to do until day 45."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

  # Every upload builds main as it is now, so when a queued upload gives way to a newer one (GitHub keeps one pending
  # run per group), the newer one still carries the latest résumé. Only uploads hold the group: the daily checks that
  # do nothing never cancel one.
  upload:
    needs: plan
    if: needs.plan.outputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Why: two runs at once would both rotate the refresh token, and the one saved last could be the one already spent.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the résumé
        run: bash scripts/build-cv.sh --force

      # A pinned release, checked against its SHA-256: Ubuntu's own rclone is too old for access_scopes.
      - name: Install rclone
        env:
          VERSION: v1.76.0
          SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        run: |
          curl -fsSL -o rclone.zip "https://downloads.rclone.org/$VERSION/rclone-$VERSION-linux-amd64.zip"
          echo "$SHA256  rclone.zip" | sha256sum -c -
          unzip -q rclone.zip
          sudo install "rclone-$VERSION-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf rclone.zip "rclone-$VERSION-linux-amd64"

      - name: Upload it to OneDrive
        env:
          ONEDRIVE_DRIVE_ID: ${{ vars.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_RCLONE_TOKEN: ${{ secrets.ONEDRIVE_RCLONE_TOKEN }}
          GH_TOKEN: ${{ secrets.ONEDRIVE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/onedrive/sync.mjs public/cv/cv_pierre_vieira.pdf

  # Last and apart from the upload, so a failure here never blocks a renewal, and a failed renewal never stops this.
  keep-schedule-on:
    needs: [plan, upload]
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.repository == 'PierreVieira/pierre-vieira-site' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable onedrive-cv.yml
